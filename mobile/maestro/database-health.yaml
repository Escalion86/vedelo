appId: ru.escalion.vedelo
name: Диагностика зашифрованной локальной базы
---
- launchApp:
    clearState: false
- openLink: vedelo://sync
- assertVisible: "Синхронизация"
- scrollUntilVisible:
    element:
      id: "sync-database-diagnostics"
    direction: DOWN
- assertVisible:
    id: "sync-database-diagnostics"
- assertVisible: "SQLCipher активен"
- assertVisible: "Схема: v.*"
