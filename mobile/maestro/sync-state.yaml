appId: ru.escalion.vedelo
name: Состояние синхронизации переживает offline-перезапуск
---
- setAirplaneMode: enabled
- launchApp:
    clearState: false
- openLink: vedelo://sync
- tapOn:
    id: "sync-now"
- assertVisible: "Нет сети"
- killApp
- launchApp:
    stopApp: false
- openLink: vedelo://sync
- assertVisible: "Нет сети"
- setAirplaneMode: disabled
- tapOn:
    id: "sync-now"
- assertVisible: "Всё синхронизировано"
